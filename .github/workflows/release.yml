name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # 1. Continuous Integration Job: Runs tests on every code change
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org/" # ← Add trailing slash

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  publish:
    name: Publish to npm Registry
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js for Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org/" # ← Add trailing slash

      - name: Debug npm configuration
        run: |
          echo "=== npm registry ==="
          npm config get registry

          echo "=== npm config ==="
          npm config list

          echo "=== project .npmrc ==="
          cat .npmrc

          echo "=== user config ==="
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            cat "$NPM_CONFIG_USERCONFIG"
          else
            echo "NPM_CONFIG_USERCONFIG does not exist"
          fi

          echo "=== yaml lockfile entry ==="
          grep -A4 -B2 '"node_modules/yaml"' package-lock.json
      - name: Install Dependencies
        run: npm ci

      - name: Publish Package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
